[project]
name = "skypanel"
version = "0.1.0"
description = "SkyPanel backend: ADS-B ingestion, enrichment and display-frame service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
]

[project.scripts]
skypanel = "skypanel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skypanel"]

# The airline table, the airport subset and the fixtures are part of the
# product, not test scaffolding: an installed SkyPanel with no airlines.json
# renders every airline white. skypanel.paths finds them in either layout.
[tool.hatch.build.targets.wheel.force-include]
"data" = "skypanel/data"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]
# ANN401: Any is the honest annotation for a decoded-JSON boundary.
# N818 wants an "Error" suffix on every exception; QuotaExhausted and
# CassetteMiss read better as they are and are both narrowly scoped.
# RUF001 flags the arrow and climb/descent glyphs, which are deliberate.
ignore = ["ANN401", "N818", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# web.py is embedded HTML/CSS/JS; wrapping those lines makes them less readable.
"skypanel/web.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["skypanel"]
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # starlette's TestClient nags about httpx2; we pin httpx deliberately
    # because it is the transport the production code injects into.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
