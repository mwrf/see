[project]
name = "skypanel"
version = "0.1.0"
description = "SkyPanel backend: ADS-B ingest, enrichment and display-frame service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.scripts]
skypanel-serve = "skypanel.cli:serve"
skypanel-capture = "skypanel.cli:capture_fixtures"
skypanel-airline = "skypanel.cli:add_airline"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skypanel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "C4", "PTH"]
ignore = ["ANN401"]
# Prose uses en dashes, and the display contract uses real arrow glyphs — the renderer
# draws them as dedicated 5px shapes, so they must survive round-tripping as themselves.
allowed-confusables = ["–", "×", "→", "↑", "↓", "°"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# `Body(...)` in a default is how FastAPI declares a request body; it is the framework's
# idiom, not an accidental mutable default.
"skypanel/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["skypanel", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Tests are checked, but not required to carry annotations — a test's signature is
# almost entirely pytest fixtures, and spelling those out adds noise, not safety.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
