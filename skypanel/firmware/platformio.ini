; SkyPanel firmware.
;
; Two environments over one source tree:
;
;   esp32s3  the real thing — Adafruit MatrixPortal S3 driving a 64x32 HUB75 panel
;   native   the render path compiled for the host, for the unit tests
;
; `lib/render`, `lib/device` and the `IDisplay`/`IHttpClient` interfaces build for both.
; The SDL2 emulator is a separate CMake build (see emulator/CMakeLists.txt) because it
; needs pkg-config and a real linker for SDL2 and zlib, which PlatformIO's native
; platform does not provide. Both builds compile the same files; neither owns a copy.

[platformio]
default_envs = esp32s3

[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags = -std=gnu++11

; ---------------------------------------------------------------------- hardware

[env:esp32s3]
platform = espressif32@^6.9.0
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DSKYPANEL_WITH_OTA=1
    ; The renderer is small and hot; -O2 keeps the 30 fps scroll comfortable.
    -O2

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.1
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.11
    chrisjoyce911/esp32FOTA@^0.2.7
    bblanchon/ArduinoJson@^7.1.0

lib_ignore =
    ; Vendored only so the desktop build has something to compile against; on-device the
    ; real library comes from lib_deps above.
    Adafruit_GFX
    ; Desktop-only implementations.
    compat

; --------------------------------------------------------------------- host tests

[env:native]
platform = native
test_framework = custom

build_flags =
    ${env.build_flags}
    -DARDUINO=100
    -DSKYPANEL_NATIVE=1
    -I lib/compat
    -I lib/third_party/Adafruit_GFX
    -I lib/render
    -I lib/display
    -I lib/net
    -I lib/device
    -I test

build_src_filter =
    -<*>

lib_ignore =
    ; Nothing under src/ builds for the host: main.cpp is Arduino-only.
