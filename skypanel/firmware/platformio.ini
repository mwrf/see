; SkyPanel firmware.
;
;   pio run -e esp32s3            build for the MatrixPortal S3
;   pio run -e esp32s3 -t upload  flash over USB-C
;   pio run -e native -t test     run the render-path tests
;
; The native environment builds the same lib/render and lib/app sources as the
; device. That is the point: the emulator is not a mock, and these tests are
; the ones that gate a release.
;
; CMakeLists.txt in the repository root builds the emulator and the same test
; binary without PlatformIO, for developers who only want the desktop side.

[platformio]
default_envs = esp32s3

[env]
framework = arduino
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags = -std=gnu++11
lib_ldf_mode = deep+

[env:esp32s3]
platform = espressif32@^6.5.0
board = adafruit_matrixportal_esp32s3
board_build.partitions = default_8MB.csv
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.11
    chrisjoyce911/esp32FOTA@^0.2.7

build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    ; The HUB75 driver wants its I2S buffers in DMA-capable RAM; on the S3 that
    ; is internal SRAM, so keep the framebuffer out of PSRAM.
    -DNO_GFX_PSRAM
    ; Brownout detection stays ON: a supply sag on a bright frame is exactly
    ; the failure we want reported rather than silently corrupting flash.
    -DCONFIG_ESP32_BROWNOUT_DET=1

; Vendored Adafruit_GFX is only used by the native build, where there is no
; library manager to fetch it from.
build_src_filter = +<*> -<../lib/vendor/>

[env:native]
platform = native
test_framework = custom
build_flags =
    ${env.build_flags}
    -DARDUINO=10819
    -I lib/arduino_compat
    -I lib/vendor/Adafruit_GFX
    -I lib/render
    -I lib/display
    -I lib/net
    -I lib/app
    -I ../emulator
build_src_filter = +<../lib/vendor/Adafruit_GFX/Adafruit_GFX.cpp>
lib_compat_mode = off
